<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할일 목록</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #8a8f98;
      --border: #e3e5e8;
      --accent: #4f6ef7;
      --danger: #e5484d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #1f2227;
        --text: #e8eaed;
        --muted: #8a8f98;
        --border: #2e3238;
        --accent: #7b93ff;
        --danger: #ff6369;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    .header { margin-bottom: 22px; }
    .header .date {
      margin: 0 0 4px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, var(--accent), #b25cf0 60%, #f06595);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 .emoji { -webkit-text-fill-color: initial; color: initial; margin-left: 6px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      cursor: pointer;
      font: inherit;
      border: none;
      border-radius: 8px;
    }
    .add-btn {
      padding: 0 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .filters { display: flex; gap: 4px; margin-bottom: 12px; }
    .filters button {
      padding: 6px 12px;
      font-size: 13px;
      background: transparent;
      color: var(--muted);
    }
    .filters button.active { background: var(--bg); color: var(--text); font-weight: 600; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }
    li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    li .text { flex: 1; word-break: break-word; }
    li.done .text { text-decoration: line-through; color: var(--muted); }
    li .del {
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      padding: 2px 8px;
      opacity: 0;
    }
    li:hover .del, li .del:focus { opacity: 1; }
    li .del:hover { color: var(--danger); }
    @media (hover: none) { li .del { opacity: 1; } }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .footer button { background: transparent; color: var(--muted); font-size: 13px; }
    .footer button:hover { color: var(--danger); }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <p class="date" id="today"></p>
      <h1>오늘의 할일<span class="emoji">✨</span></h1>
    </div>

    <form id="form">
      <input type="text" id="input" placeholder="할 일을 입력하세요" autocomplete="off" autofocus>
      <button type="submit" class="add-btn">추가</button>
    </form>

    <div class="filters">
      <button data-filter="all" class="active">전체</button>
      <button data-filter="active">진행 중</button>
      <button data-filter="done">완료</button>
    </div>

    <ul id="list"></ul>

    <div class="footer">
      <span id="count"></span>
      <button id="clear">완료 항목 삭제</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'todos';
    let todos = load();
    let filter = 'all';

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const list = document.getElementById('list');
    const count = document.getElementById('count');

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch {}
    }

    function render() {
      const visible = todos.filter(t =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done
      );

      list.innerHTML = '';
      if (visible.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.style.border = 'none';
        empty.style.justifyContent = 'center';
        empty.textContent = '할 일이 없습니다';
        list.appendChild(empty);
      }

      for (const todo of visible) {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', () => {
          todo.done = checkbox.checked;
          update();
        });

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = todo.text;
        text.title = '더블클릭하여 수정';
        text.addEventListener('dblclick', () => {
          const next = prompt('할 일 수정', todo.text);
          if (next !== null && next.trim()) {
            todo.text = next.trim();
            update();
          }
        });

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.setAttribute('aria-label', '삭제');
        del.addEventListener('click', () => {
          todos = todos.filter(t => t.id !== todo.id);
          update();
        });

        li.append(checkbox, text, del);
        list.appendChild(li);
      }

      const remaining = todos.filter(t => !t.done).length;
      count.textContent = `남은 할 일 ${remaining}개`;
    }

    function update() {
      save();
      render();
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false });
      input.value = '';
      update();
    });

    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    });

    document.getElementById('clear').addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      update();
    });

    document.getElementById('today').textContent = new Date().toLocaleDateString('ko-KR', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });

    render();
  </script>
</body>
</html>
